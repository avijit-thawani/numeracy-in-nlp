name: Update survey

on:
  # Someone edited the seed list, dropped in a bibliography, or changed settings.
  push:
    paths:
      - "survey.config.json"
      - "import/**"
  # Someone opened an "Add a paper" issue.
  issues:
    types: [opened]
  # The "Run workflow" button.
  workflow_dispatch:
    inputs:
      refresh:
        description: "Also re-fetch citation counts for every paper"
        type: boolean
        default: true
  # Daily refresh. This commit is also what keeps the schedule alive: GitHub
  # disables cron in public repos after 60 days with no repository activity,
  # and its own runs do not count as activity -- but the commit it makes does.
  # An odd minute, because on-the-hour crons queue behind everyone else's.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

# Never let two runs rewrite the data files at once.
concurrency:
  group: update-survey
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The citation graph is derived, not data. It is several megabytes and
      # would be rewritten every day, so committing it would bloat the repo's
      # history for no benefit. A cold cache just means the run refetches, and
      # graphBudget already bounds how much that costs.
      - name: Restore the citation graph cache
        uses: actions/cache@v4
        with:
          path: .cache/graph.json
          key: citation-graph-${{ github.run_id }}
          restore-keys: citation-graph-

      - name: Build the survey
        env:
          # Cron and manual runs also re-check citation counts; a plain push
          # only looks up the new papers, which is much quicker.
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            node scripts/update.js --refresh
          else
            node scripts/update.js
          fi

      - name: Commit the results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so that files a run *removes*, such as an input it migrated
          # away, are staged as deletions rather than resurrected next checkout.
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Update living survey"

          # Another run may have landed while this one was fetching papers.
          # Everything under data/ and views/, and the README's generated
          # block, is rewritten wholesale every run, so two runs conflict on
          # every one of those files. "-X theirs" during a rebase favours the
          # commit being replayed, which is this run's fresher output, while
          # genuine remote changes such as someone editing import/ still merge
          # normally. Without it this step just fails.
          for attempt in 1 2 3; do
            if git push -q origin "${GITHUB_REF_NAME}" 2>/dev/null; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced with another run; rebasing and retrying ($attempt of 3)."
            git fetch -q origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort || true
              echo "::warning::Rebase failed; leaving this run's changes for the next one."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

      # Matches the label or the title prefix: "Use this template" copies files
      # but not labels, so a fresh survey has no 'add-paper' label until the
      # first one is created.
      - name: Reply to the paper request
        if: >-
          github.event_name == 'issues' &&
          (contains(github.event.issue.labels.*.name, 'add-paper') ||
           startsWith(github.event.issue.title, 'Add paper:'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.html_url }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            gh issue comment "$ISSUE" --body "Added to the survey — thanks! See the updated table in the README."
            gh issue close "$ISSUE"
          else
            gh issue comment "$ISSUE" --body "I could not look that one up, or it was already in the survey. Check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi

      # One pull request per top Rec, so accepting is a merge and rejecting is
      # a close. Off unless survey.config.json turns it on, because GitHub
      # blocks Actions from opening pull requests until a repository setting
      # is changed by hand.
      - name: Open pull requests for the top Recs
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          node scripts/openRecPRs.js

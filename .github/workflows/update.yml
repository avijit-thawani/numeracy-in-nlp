name: Update survey

on:
  # Someone edited the seed list, dropped in a bibliography, or changed settings.
  push:
    # Only the default branch. Without this, pushing a rec/ branch for a
    # suggestion fired an entire survey run on that branch: wasted work, a
    # polluted pull request diff, and worst of all a second run holding the
    # same concurrency slot, which let a stale run overwrite a fresher one.
    branches: [main]
    paths:
      - "survey.config.json"
      - "import/**"
      # Code too, so syncing a template change re-renders the survey instead
      # of leaving it on the previous format until something else triggers a
      # run. Cheap now the citation graph is cached.
      - "lib/**"
      - "scripts/**"
  # Someone opened an "Add a paper" issue.
  issues:
    types: [opened]
  # The "Run workflow" button.
  workflow_dispatch:
    inputs:
      refresh:
        description: "Also re-fetch citation counts for every paper"
        type: boolean
        default: true
  # Daily refresh. This commit is also what keeps the schedule alive: GitHub
  # disables cron in public repos after 60 days with no repository activity,
  # and its own runs do not count as activity -- but the commit it makes does.
  # An odd minute, because on-the-hour crons queue behind everyone else's.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

# Never let two runs rewrite the data files at once.
concurrency:
  group: update-survey
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The citation graph is derived, not data. It is several megabytes and
      # would be rewritten every day, so committing it would bloat the repo's
      # history for no benefit. A cold cache just means the run refetches, and
      # graphBudget already bounds how much that costs.
      - name: Restore the citation graph cache
        uses: actions/cache@v4
        with:
          path: .cache/graph.json
          key: citation-graph-${{ github.run_id }}
          restore-keys: citation-graph-

      - name: Build the survey
        env:
          # Cron and manual runs also re-check citation counts; a plain push
          # only looks up the new papers, which is much quicker.
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
          # Actions does not put GITHUB_TOKEN in the environment on its own, so
          # without this the owner-email lookup behind `contactEmail` bailed out
          # every run and OpenAlex's polite pool was never reached. Read-only
          # use: one call to /users/<owner> for a public email.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            node scripts/update.js --refresh
          else
            node scripts/update.js
          fi

      # Pull requests must exist before the final render, so each Rec row can
      # link to its own. Opening them needs the survey data this run just
      # wrote, hence the order: build, open, render, commit.
      - name: Open pull requests for the top Recs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          node scripts/openRecPRs.js
          node scripts/render.js

      - name: Commit the results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so that files a run *removes*, such as an input it migrated
          # away, are staged as deletions rather than resurrected next checkout.
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Update living survey"

          # If another run landed first, throw this run's output away rather
          # than forcing it on top. Everything under data/ and views/ is a pure
          # function of the inputs in import/, so a discarded output costs only
          # the recompute, whereas forcing it can revert work that was based on
          # newer inputs. That happened: a stale run overwrote a merged paper
          # and Core silently dropped back from 22 to 20.
          if git push -q origin "${GITHUB_REF_NAME}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Another run pushed first. Discarding this run's output; the next run will regenerate it from the current inputs."
          git reset -q --hard "origin/${GITHUB_REF_NAME}" 2>/dev/null || true
          echo "changed=false" >> "$GITHUB_OUTPUT"

          # Every input except an issue is a file, so the reset above restores
          # it and a later run reads it again. An issue's links exist only in
          # the event, which does not fire twice, so discarding would lose the
          # paper outright and the requester would be told it could not be
          # found. Append them to the seed list instead: that is a push to
          # import/, which triggers the run that ingests them.
          if [ -s .cache/issue-links.txt ]; then
            while IFS= read -r link; do
              [ -n "$link" ] || continue
              grep -qxF "$link" import/papers.txt || printf '%s\n' "$link" >> import/papers.txt
            done < .cache/issue-links.txt

            if ! git diff --quiet -- import/papers.txt; then
              git add import/papers.txt
              git commit -q -m "Queue papers from an issue that a concurrent run displaced"
              if git push -q origin "${GITHUB_REF_NAME}" 2>/dev/null; then
                echo "requeued=true" >> "$GITHUB_OUTPUT"
                echo "::notice::Requeued the issue's links in import/papers.txt; the run that triggers will add them."
              else
                git reset -q --hard "origin/${GITHUB_REF_NAME}" 2>/dev/null || true
                echo "::warning::Could not requeue the issue's links. Re-open the issue to retry."
              fi
            fi
          fi

      # Matches the label or the title prefix: "Use this template" copies files
      # but not labels, so a fresh survey has no 'add-paper' label until the
      # first one is created.
      - name: Reply to the paper request
        if: >-
          github.event_name == 'issues' &&
          (contains(github.event.issue.labels.*.name, 'add-paper') ||
           startsWith(github.event.issue.title, 'Add paper:'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.html_url }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          REQUEUED: ${{ steps.commit.outputs.requeued }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            gh issue comment "$ISSUE" --body "Added to the survey — thanks! See the updated table in the README."
            gh issue close "$ISSUE"
          elif [ "$REQUEUED" = "true" ]; then
            # Do not say "could not look that one up" here: the lookup worked,
            # a concurrent run just displaced the result. Leave the issue open
            # until the requeued run has actually added the paper.
            gh issue comment "$ISSUE" --body "Another update was running, so I queued this in \`import/papers.txt\` instead. The next run adds it, usually within a minute or two."
          else
            gh issue comment "$ISSUE" --body "I could not look that one up, or it was already in the survey. Check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
